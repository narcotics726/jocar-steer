[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor -L defmt"

# `cargo test` is not used in this firmware — all verification is manual
# (flash + monitor). Alias it to a plain build so `cargo test` never tries to
# compile host test harnesses for this no_std target.
[alias]
test = "build"

[env]
DEFMT_LOG = "info"

[build]
rustflags = ["-C", "link-arg=-nostartfiles", "-Z", "stack-protector=all"]

target = "xtensa-esp32s3-none-elf"

[unstable]
build-std = ["alloc", "core"]
